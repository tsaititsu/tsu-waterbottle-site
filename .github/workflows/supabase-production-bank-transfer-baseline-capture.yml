name: Supabase Production Bank Transfer Baseline Capture
run-name: Bank Transfer baseline read-only capture at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      authorized_commit:
        description: Exact main commit SHA authorized for this capture
        required: true
        type: string
      project_ref:
        description: Exact authorized Supabase project ref
        required: true
        type: string
      confirmation:
        description: Exact one-time read-only capture confirmation phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-bank-transfer-baseline-capture
  cancel-in-progress: false

jobs:
  source-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up fixed Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.16.0"

      - name: Validate exact Node.js runtime
        run: node scripts/supabase/validate-bank-transfer-production-baseline-capture.mjs node

      - name: Validate fixed PostgreSQL image identity
        env:
          POSTGRES_IMAGE: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        run: node scripts/supabase/validate-bank-transfer-production-baseline-capture.mjs image

      - name: Validate fixed baseline capture source
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          AUTHORIZED_COMMIT: ${{ inputs.authorized_commit }}
          PROJECT_REF_INPUT: ${{ inputs.project_ref }}
          BASELINE_CAPTURE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/supabase/validate-bank-transfer-production-baseline-capture.mjs source

  capture-production:
    needs: source-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: supabase-production
    steps:
      - name: Check out the exact authorized commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up fixed Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.16.0"

      - name: Run one fixed read-only baseline capture session
        env:
          SUPABASE_PRODUCTION_CHANNEL_READY: ${{ vars.SUPABASE_PRODUCTION_CHANNEL_READY }}
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          SUPABASE_PROJECT_ID: ndbqoznvobmpkgxkiezz
        run: node scripts/supabase/run-bank-transfer-production-baseline-capture.mjs

      - name: Upload private one-day baseline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bank-transfer-baseline-capture
          path: ${{ runner.temp }}/bank-transfer-baseline-capture.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          archive: false
