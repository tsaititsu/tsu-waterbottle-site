name: Supabase Production LINE Pay NT1 Non-Fulfillment Verify
run-name: LINE Pay NT1 non-fulfillment read-only verify at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      authorized_commit:
        description: Exact main commit SHA authorized for this verification
        required: true
        type: string
      project_ref:
        description: Exact authorized Supabase project ref
        required: true
        type: string
      confirmation:
        description: Exact read-only verification phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-line-pay-one-dollar-non-fulfillment-verify
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: supabase-production
    steps:
      - name: Check out the exact authorized commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up fixed Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.16.0"
      - name: Validate fixed Node.js
        run: node scripts/supabase/validate-line-pay-production-one-dollar-non-fulfillment.mjs node
      - name: Validate read-only verification source
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          AUTHORIZED_COMMIT: ${{ inputs.authorized_commit }}
          PROJECT_REF_INPUT: ${{ inputs.project_ref }}
          VERIFY_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/supabase/validate-line-pay-production-one-dollar-non-fulfillment.mjs verify-source
      - name: Validate fixed PostgreSQL image
        env:
          POSTGRES_IMAGE: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        run: node scripts/supabase/validate-line-pay-production-one-dollar-non-fulfillment.mjs image
      - name: Validate protected Production channel
        env:
          SUPABASE_PRODUCTION_CHANNEL_READY: ${{ vars.SUPABASE_PRODUCTION_CHANNEL_READY }}
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          SUPABASE_PROJECT_ID: ndbqoznvobmpkgxkiezz
        run: node scripts/supabase/validate-line-pay-production-one-dollar-non-fulfillment.mjs channel
      - name: Run read-only postflight verification
        env:
          SUPABASE_PRODUCTION_CHANNEL_READY: ${{ vars.SUPABASE_PRODUCTION_CHANNEL_READY }}
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          SUPABASE_PROJECT_ID: ndbqoznvobmpkgxkiezz
        run: node scripts/supabase/run-line-pay-production-one-dollar-non-fulfillment-exact-file.mjs verify
