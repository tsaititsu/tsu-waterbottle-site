name: LINE Pay Gateway CI

on:
  push:
    paths:
      - ".env.example"
      - ".github/workflows/line-pay-gateway-ci.yml"
      - "infra/line-pay-gateway/**"
      - "src/lib/linePay/**"
  pull_request:
    paths:
      - ".env.example"
      - ".github/workflows/line-pay-gateway-ci.yml"
      - "infra/line-pay-gateway/**"
      - "src/lib/linePay/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-pay-gateway-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Typecheck, test, build, and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/line-pay-gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/line-pay-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build --tag line-pay-fixed-ip-gateway:${{ github.sha }} .
