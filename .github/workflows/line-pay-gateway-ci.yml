name: LINE Pay Gateway CI

on:
  push:
    paths:
      - ".env.example"
      - ".github/workflows/line-pay-gateway-ci.yml"
      - "infra/line-pay-gateway/**"
      - "src/lib/linePay/**"
  pull_request:
    paths:
      - ".env.example"
      - ".github/workflows/line-pay-gateway-ci.yml"
      - "infra/line-pay-gateway/**"
      - "src/lib/linePay/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-pay-gateway-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway, deploy config, and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/line-pay-gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/line-pay-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check deployment script syntax
        run: bash -n deploy/scripts/*.sh deploy/tests/*.sh

      - name: Check deployment script guards
        run: |
          set -euo pipefail
          expect_exit() {
            local expected="$1"
            shift
            set +e
            "$@" >/dev/null 2>&1
            local actual="$?"
            set -e
            test "$actual" -eq "$expected"
          }
          expect_exit 2 deploy/scripts/verify-egress.sh
          expect_exit 2 deploy/scripts/verify-health.sh https://linepay-gateway.example.com/health
          expect_exit 2 deploy/scripts/verify-tls.sh linepay-gateway.example.com
          deploy/scripts/rollback.sh --help >/dev/null
          ! grep -Eq '(^|[[:space:]])(sudo|apt|apt-get|systemctl|chmod|chown|mkdir|install|tee)([[:space:]]|$)' \
            deploy/scripts/preflight.sh

      - name: Test deployment security hardening
        run: |
          set -euo pipefail
          deploy/tests/security-hardening.test.sh

          proxy_env_file="$(mktemp)"
          printf '%s\n' \
            'LINE_PAY_GATEWAY_PROXY_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
            >"$proxy_env_file"
          chmod 0600 "$proxy_env_file"
          sudo chown root:root "$proxy_env_file"
          sudo deploy/scripts/validate-proxy-env.sh "$proxy_env_file"
          sudo unlink "$proxy_env_file"

          secure_log_dir="$(mktemp -d)"
          rmdir "$secure_log_dir"
          sudo deploy/scripts/secure-log-directory.sh prepare "$secure_log_dir"
          test "$(stat -c '%U:%G %a' "$secure_log_dir")" = "root:root 750"
          sudo rmdir "$secure_log_dir"

      - name: Validate deployment examples
        run: |
          set -euo pipefail
          grep -Fx 'LINE_PAY_GATEWAY_ENV=sandbox' deploy/gateway.env.example
          grep -Fx 'LINE_PAY_GATEWAY_KEY_ID=replace-with-a-sandbox-key-id' deploy/gateway.env.example
          grep -Fx 'LINE_PAY_GATEWAY_SECRET=replace-with-a-random-sandbox-shared-secret' deploy/gateway.env.example
          grep -Fx 'LINE_PAY_GATEWAY_PROXY_TOKEN=replace-with-64-lowercase-hex-characters' \
            deploy/proxy.env.example
          test "$(grep -Ec '^[A-Z0-9_]+=' deploy/proxy.env.example)" -eq 1
          ! grep -Eq 'LINE_PAY_GATEWAY_SECRET|LINE_PAY_CHANNEL_SECRET' deploy/proxy.env.example
          grep -Fq 'linepay-gateway.tsu-waterbottle.com' deploy/Caddyfile.example
          grep -Fq 'linepay-gateway.tsu-waterbottle.com' deploy/SANDBOX_DEPLOY_RUNBOOK.md
          grep -Fq 'linepay-gateway.tsu-waterbottle.com' README.md
          grep -Fq 'linepay-gateway.tsu-waterbottle.com' ../../docs/line-pay-gateway-sandbox-deploy-plan.md
          grep -Fq '165.245.144.110' deploy/SANDBOX_DEPLOY_RUNBOOK.md
          grep -Fq '165.245.144.110' README.md
          grep -Fq '165.245.144.110' ../../docs/line-pay-gateway-sandbox-deploy-plan.md
          grep -Fq '165.245.144.110/32' deploy/SANDBOX_DEPLOY_RUNBOOK.md
          grep -Fq '165.245.144.110/32' README.md
          grep -Fq '165.245.144.110/32' ../../docs/line-pay-gateway-sandbox-deploy-plan.md
          grep -Fq '入站用途' deploy/SANDBOX_DEPLOY_RUNBOOK.md
          grep -Fq '出站用途' deploy/SANDBOX_DEPLOY_RUNBOOK.md
          test "$(grep -Fc 'header_up X-Gateway-Proxy-Token {$LINE_PAY_GATEWAY_PROXY_TOKEN}' deploy/Caddyfile.example)" -eq 1
          test "$(grep -Eic '^[[:space:]]*header_up[[:space:]]+X-Gateway-Proxy-Token([[:space:]]|$)' deploy/Caddyfile.example)" -eq 1
          ! grep -Eq 'header_up X-Gateway-Proxy-Token \{http\.request\.header\.' deploy/Caddyfile.example
          test "$(grep -Fc 'header_up X-Gateway-Client-IP {remote_host}' deploy/Caddyfile.example)" -eq 1
          test "$(grep -Eic '^[[:space:]]*header_up[[:space:]]+X-Gateway-Client-IP([[:space:]]|$)' deploy/Caddyfile.example)" -eq 1
          ! grep -Eq 'header_up X-Gateway-Client-IP \{http\.request\.header\.' deploy/Caddyfile.example
          grep -Fq 'DNS only／灰雲' deploy/SANDBOX_DEPLOY_RUNBOOK.md
          grep -Fq '禁止開啟 Cloudflare Proxy／橘雲' deploy/SANDBOX_DEPLOY_RUNBOOK.md
          ! grep -Eqi '(BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})' \
            deploy/Caddyfile.example \
            deploy/gateway.env.example \
            deploy/proxy.env.example \
            deploy/compose.yaml

      - name: Validate Caddyfile syntax
        run: |
          docker run --rm \
            --env LINE_PAY_GATEWAY_PROXY_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --volume "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate Docker Compose config
        env:
          GATEWAY_IMAGE_TAG: ${{ github.sha }}
          LINE_PAY_GATEWAY_ENV_FILE: ./gateway.env.example
          LINE_PAY_GATEWAY_PROXY_ENV_FILE: ./proxy.env.example
          GATEWAY_BIND_PORT: "3000"
        run: |
          set -euo pipefail
          deploy/scripts/compose.sh config --quiet
          if GATEWAY_IMAGE_TAG="${GATEWAY_IMAGE_TAG}" \
            docker compose -f deploy/compose.yaml config --quiet >/dev/null 2>&1
          then
            echo "Direct Compose execution bypassed release input validation." >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: |
          set -euo pipefail
          deploy/scripts/validators.sh \
            release \
            line-pay-fixed-ip-gateway \
            "${{ github.sha }}"
          docker build --tag "line-pay-fixed-ip-gateway:${{ github.sha }}" .

      - name: Test Docker runtime Proxy Token boundary
        env:
          GATEWAY_IMAGE_TAG: ${{ github.sha }}
        run: deploy/tests/docker-runtime.test.sh

  website-line-pay:
    name: Website LINE Pay tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run LINE Pay tests
        run: |
          set -euo pipefail
          for test_file in \
            src/lib/linePay/*.test.ts \
            src/app/cart/linePayCheckout.test.ts \
            src/app/api/product-orders/line-pay/redirect.test.ts \
            src/app/api/product-orders/line-pay/request/handler.test.ts \
            src/app/api/product-orders/line-pay/cancel/handler.test.ts \
            src/app/api/product-orders/line-pay/confirm/handler.test.ts
          do
            node_modules/.bin/jiti "$test_file"
          done
