name: LINE Pay DB Contract CI

on:
  pull_request:
    paths:
      - ".github/workflows/line-pay-db-contract-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "src/lib/supabase/linePayDatabaseContracts.ts"
      - "src/lib/supabase/linePayDatabaseContracts.test.ts"
      - "supabase/line_pay_remediation_contracts.test.ts"
      - "supabase/migrations/20260719033404_line_pay_remediation_contracts.sql"
      - "supabase/tests/line_pay_*.sql"
      - "supabase/tests/run_line_pay_remediation_*.mjs"
      - "supabase/tests/run_line_pay_second_remediation_conflicts.mjs"

permissions:
  contents: read

concurrency:
  group: line-pay-db-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contracts:
    name: PostgreSQL contracts and mutations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run static database contract tests
        run: |
          node --test supabase/line_pay_remediation_contracts.test.ts
          node --test src/lib/supabase/linePayDatabaseContracts.test.ts

      - name: Run disposable PostgreSQL contract suite
        run: node supabase/tests/run_line_pay_remediation_db_contracts.mjs

      - name: Run fail-closed conflict fixtures
        run: node supabase/tests/run_line_pay_second_remediation_conflicts.mjs

      - name: Run database mutation coverage
        run: node supabase/tests/run_line_pay_remediation_mutations.mjs

      - name: Remove task-owned Docker resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -aq --filter label=task=line-pay-remediation-pr1 |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=line-pay-remediation-pr1 |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=line-pay-remediation-pr1 |
            xargs -r docker network rm
