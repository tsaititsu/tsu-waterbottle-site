permissions:
  contents: read

concurrency:
  group: line-pay-db-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contracts:
    name: PostgreSQL contracts and mutations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run static database contract tests
        run: |
          node --test supabase/bank_transfer_submissions_readonly_fence.test.ts
          node --test supabase/bank_transfer_baseline_capture_workflow.test.ts
          node --test supabase/bank_transfer_baseline_capture_runner.test.ts
          node --test supabase/bank_transfer_historical_forensic_workflow.test.ts
          node --test supabase/bank_transfer_historical_forensic_runner.test.ts
          node --test supabase/line_pay_remediation_contracts.test.ts
          node --test supabase/line_pay_atomic_confirmation_finalization.test.ts
          node --test supabase/line_pay_atomic_confirmation_finalization_production_runner.test.ts
          node --test supabase/line_pay_atomic_confirmation_finalization_production_workflow.test.ts
          node --import tsx --test supabase/line_pay_atomic_confirmation_finalization_capability_diagnostic.test.ts
          node --test supabase/line_pay_paid_reconciliation_recovery.test.ts
          node --test supabase/line_pay_checkout_aggregate_initialization.test.ts
          node --test supabase/line_pay_checkout_initializer_production_runner.test.ts
          node --test supabase/line_pay_checkout_initializer_production_workflow.test.ts
          node --test supabase/line_pay_checkout_initializer_contract_detail_diagnostic.test.ts
          node --test supabase/line_pay_function_owner_membership_diagnostic.test.ts
          node --test supabase/line_pay_production_diagnostic_workflow.test.ts
          node --test supabase/line_pay_production_diagnostic_runner.test.ts
          node --test supabase/line_pay_application_state_diagnostic_workflow.test.ts
          node --test supabase/line_pay_application_state_diagnostic_runner.test.ts
          node --test supabase/line_pay_partial_acl_metadata_recovery.test.ts
          node --test supabase/line_pay_partial_acl_recovery_capability_diagnostic.test.ts
          node --test supabase/line_pay_production_exact_file_runner.test.ts
          node --test supabase/line_pay_production_deployment_workflow.test.ts
          node --import tsx --test supabase/service_line_pay_checkout_production_runner.test.ts
          node --import tsx --test supabase/line_pay_production_one_dollar_non_fulfillment.test.ts
          node --test src/lib/supabase/linePayDatabaseContracts.test.ts
          node --import tsx --test src/lib/supabase/linePayCheckoutInitialization.test.ts
          node --import tsx --test src/lib/supabase/linePayCapabilityRuntime.test.ts
          node --import tsx --test src/lib/supabase/linePayExecutor.test.ts
          node --import tsx --test src/app/api/internal/line-pay/sandbox-e2e/executor-readiness/handler.test.ts

      - name: Run LINE Pay Production exact-file contracts
        run: node supabase/tests/run_line_pay_production_exact_file_contracts.mjs

      - name: Run LINE Pay Production read-only diagnostic contracts
        run: node supabase/tests/run_line_pay_production_diagnostic_contracts.mjs

      - name: Run LINE Pay application-state diagnostic contracts
        run: node supabase/tests/run_line_pay_application_state_diagnostic_contracts.mjs

      - name: Run bank transfer historical forensic contracts
        run: node supabase/tests/run_bank_transfer_historical_forensic_contracts.mjs

      - name: Run bank transfer baseline capture contracts
        run: node supabase/tests/run_bank_transfer_baseline_capture_contracts.mjs

      - name: Run bank transfer read-only fence contracts
        run: node supabase/tests/run_bank_transfer_submissions_readonly_fence.mjs

      - name: Run disposable PostgreSQL contract suite
        env:
          LINE_PAY_ATOMIC_FINALIZATION_MIGRATION_UNDER_TEST: supabase/migrations/20260802160000_line_pay_atomic_confirmation_finalization.sql
          LINE_PAY_PAID_RECOVERY_MIGRATION_UNDER_TEST: supabase/migrations/20260803193000_line_pay_paid_reconciliation_recovery.sql
        run: node supabase/tests/run_line_pay_remediation_db_contracts.mjs

      - name: Run atomic LINE Pay checkout initialization contracts
        run: node supabase/tests/run_line_pay_checkout_aggregate_initialization.mjs

      - name: Run LINE Pay checkout initializer Production contracts
        run: node supabase/tests/run_line_pay_checkout_initializer_production_contracts.mjs

      - name: Run LINE Pay atomic finalization Production contracts
        run: node supabase/tests/run_line_pay_atomic_confirmation_finalization_production_contracts.mjs

      - name: Run LINE Pay atomic finalization capability diagnostic contracts
        run: node supabase/tests/run_line_pay_atomic_finalization_capability_diagnostic_contracts.mjs

      - name: Run LINE Pay Production NT$1 non-fulfillment contracts
        run: node supabase/tests/run_line_pay_production_one_dollar_non_fulfillment.mjs

      - name: Run fail-closed conflict fixtures
        run: node supabase/tests/run_line_pay_second_remediation_conflicts.mjs

      - name: Run database mutation coverage
        run: node supabase/tests/run_line_pay_remediation_mutations.mjs

      - name: Remove task-owned Docker resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -aq --filter label=task=line-pay-remediation-pr1 |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=line-pay-remediation-pr1 |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=line-pay-remediation-pr1 |
            xargs -r docker network rm
          docker ps -aq --filter label=task=bank-transfer-db-readonly-fence |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=bank-transfer-db-readonly-fence |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=bank-transfer-db-readonly-fence |
            xargs -r docker network rm
          docker ps -aq --filter label=task=line-pay-production-exact-file-runner |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=line-pay-production-exact-file-runner |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=line-pay-production-exact-file-runner |
            xargs -r docker network rm
          docker ps -aq --filter label=task=line-pay-production-data-drift-diagnostic |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=line-pay-production-data-drift-diagnostic |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=line-pay-production-data-drift-diagnostic |
            xargs -r docker network rm
          docker ps -aq --filter label=task=line-pay-application-state-diagnostic |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=line-pay-application-state-diagnostic |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=line-pay-application-state-diagnostic |
            xargs -r docker network rm
          docker ps -aq --filter label=task=line-pay-checkout-initializer-production |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=line-pay-checkout-initializer-production |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=line-pay-checkout-initializer-production |
            xargs -r docker network rm
          docker ps -aq --filter label=task=line-pay-atomic-finalization-production |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=line-pay-atomic-finalization-production |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=line-pay-atomic-finalization-production |
            xargs -r docker network rm
          docker ps -aq --filter label=task=line-pay-atomic-finalization-capability-diagnostic |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=line-pay-atomic-finalization-capability-diagnostic |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=line-pay-atomic-finalization-capability-diagnostic |
            xargs -r docker network rm
          docker ps -aq --filter label=task=bank-transfer-historical-forensic |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=bank-transfer-historical-forensic |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=bank-transfer-historical-forensic |
            xargs -r docker network rm
          docker ps -aq --filter label=task=bank-transfer-baseline-capture |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=bank-transfer-baseline-capture |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=bank-transfer-baseline-capture |
            xargs -r docker network rm
          docker ps -aq --filter label=task=line-pay-initialize-aggregate-v1 |
            xargs -r docker rm --force
          docker volume ls -q --filter label=task=line-pay-initialize-aggregate-v1 |
            xargs -r docker volume rm
          docker network ls -q --filter label=task=line-pay-initialize-aggregate-v1 |
            xargs -r docker network rm
          docker ps -aq --filter label=task=line-pay-nt1-non-fulfillment |
            xargs -r docker rm --force
