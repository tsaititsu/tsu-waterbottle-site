name: Supabase Emergency Profiles ACL
run-name: Profiles ACL emergency by ${{ github.actor }} at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type the required deployment confirmation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  source-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up fixed Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Validate source context and fixed deployment files
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          node scripts/supabase/validate-profiles-admin-deployment.mjs source

  deploy-production:
    needs:
      - source-validation
    environment:
      name: supabase-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact approved commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up fixed Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Revalidate source context and fixed deployment files
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          node scripts/supabase/validate-profiles-admin-deployment.mjs source

      - name: Validate fixed PostgreSQL client
        run: |
          set -euo pipefail
          node scripts/supabase/validate-profiles-admin-deployment.mjs psql

      - name: Run fail-closed metadata preflight
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          node scripts/supabase/run-fixed-psql.mjs preflight

      - name: Apply the fixed emergency Migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          node scripts/supabase/run-fixed-psql.mjs migration

      - name: Run fail-closed metadata postflight
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          node scripts/supabase/run-fixed-psql.mjs postflight
